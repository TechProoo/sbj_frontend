<!doctype html>
<html lang="en-NG">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!--
      The VITE_SITE_URL placeholders below are substituted by Vite at build
      time. That variable must hold the site's real public origin with no
      trailing slash, because every canonical, og:url and JSON-LD URL here is
      built from it. It is set in netlify.toml.
    -->
    <title>SBJ Foods and Drinks — food delivery at UI, Ibadan</title>
    <meta
      name="description"
      content="Jollof, swallow and soup, shawarma and small chops, cooked to order at the Independence Hall cafeteria, University of Ibadan. Delivery across campus and to Agbowo, Sango, Bodija and Orogun, or collect at the counter. Plates from ₦200."
    />
    <link rel="canonical" href="%VITE_SITE_URL%/" />
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <meta name="author" content="SBJ Foods and Drinks" />

    <!-- ------------------------------------------------ social previews -->
    <!--
      These are static on purpose. WhatsApp, Facebook and X do not run
      JavaScript when they scrape a link, so whatever is in this file is what
      every shared URL shows. The per-route tags set from React are for
      Google, which does execute JS.
    -->
    <meta property="og:site_name" content="SBJ Foods and Drinks" />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="en_NG" />
    <meta property="og:url" content="%VITE_SITE_URL%/" />
    <meta
      property="og:title"
      content="SBJ Foods and Drinks — food delivery at UI, Ibadan"
    />
    <meta
      property="og:description"
      content="Jollof, swallow and soup, shawarma and small chops, cooked to order at Indy Hall, UI. Delivery across campus and nearby, or collect at the counter."
    />
    <meta property="og:image" content="%VITE_SITE_URL%/og/share.jpg" />
    <meta property="og:image:secure_url" content="%VITE_SITE_URL%/og/share.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="A plate of SBJ party jollof rice with chicken"
    />

    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="SBJ Foods and Drinks — food delivery at UI, Ibadan"
    />
    <meta
      name="twitter:description"
      content="Jollof, swallow and soup, shawarma and small chops, cooked to order at Indy Hall, UI. Delivery across campus and nearby, or collect at the counter."
    />
    <meta name="twitter:image" content="%VITE_SITE_URL%/og/share.jpg" />

    <!-- ------------------------------------------------ app / icons -->
    <link rel="icon" type="image/png" href="/brand/sbj-logo.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#e8431f" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="SBJ Foods" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />

    <!--
      ------------------------------------------------ structured data

      This is what puts opening hours, the price range and a menu link into
      Google's result for "sbj foods ui" rather than a bare blue link.

      The address and telephone below are the real ones. Keep them exactly in
      step with the Google Business Profile — Google cross-checks the two, and
      a mismatch quietly costs you the map pack.
    -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Restaurant",
        "name": "SBJ Foods and Drinks",
        "url": "%VITE_SITE_URL%/",
        "image": "%VITE_SITE_URL%/og/share.jpg",
        "logo": "%VITE_SITE_URL%/brand/sbj-logo.png",
        "description": "Nigerian kitchen classics cooked to order at the Independence Hall cafeteria, University of Ibadan — jollof and fried rice, swallow and soup, shawarma, small chops and drinks. Delivery, pickup and dine-in.",
        "servesCuisine": ["Nigerian", "West African"],
        "priceRange": "₦₦",
        "currenciesAccepted": "NGN",
        "paymentAccepted": "Cash, Card, Bank transfer, USSD",
        "hasMenu": "%VITE_SITE_URL%/menu",
        "acceptsReservations": "False",
        "address": {
          "@type": "PostalAddress",
          "streetAddress": "Independence Hall Cafeteria, Great Independence Hall, University of Ibadan",
          "addressLocality": "Ibadan",
          "addressRegion": "Oyo",
          "addressCountry": "NG"
        },
        "telephone": "+2349112378705",
        "areaServed": [
          { "@type": "Place", "name": "University of Ibadan" },
          { "@type": "Place", "name": "Agbowo" },
          { "@type": "Place", "name": "Sango, Ibadan" },
          { "@type": "Place", "name": "Bodija" },
          { "@type": "Place", "name": "Orogun, Ibadan" }
        ],
        "openingHoursSpecification": [
          {
            "@type": "OpeningHoursSpecification",
            "dayOfWeek": [
              "Monday",
              "Tuesday",
              "Wednesday",
              "Thursday",
              "Friday",
              "Saturday",
              "Sunday"
            ],
            "opens": "08:00",
            "closes": "21:30"
          }
        ],
        "potentialAction": {
          "@type": "OrderAction",
          "target": {
            "@type": "EntryPoint",
            "urlTemplate": "%VITE_SITE_URL%/menu",
            "inLanguage": "en-NG",
            "actionPlatform": [
              "http://schema.org/DesktopWebPlatform",
              "http://schema.org/MobileWebPlatform"
            ]
          },
          "deliveryMethod": [
            "http://purl.org/goodrelations/v1#DeliveryModeOwnFleet",
            "http://purl.org/goodrelations/v1#DeliveryModePickUp"
          ]
        }
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
